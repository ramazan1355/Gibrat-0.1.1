<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Регистрация</title>
    <link rel="stylesheet" href="рег.css"> 
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT</h1>
        </header>
        <main class="content register-page">
            <h2 class="register-title">Register</h2>
            <form id="register-form" class="register-form">
                <input type="text" id="reg-full-name" name="full-name" placeholder="full name" required>
                <input type="email" id="reg-email" name="email" placeholder="email" required>
                <input type="password" id="reg-password" name="password" placeholder="pasword" required>
                <input type="password" id="reg-confirm-password" name="confirm-password" placeholder="confirm pasword" required>
                <a href="#" class="btn primary">sing up</a>
                <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </main>
    </div>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="firebase-auth.js"></script>
    <script type="module" src="firebase-form-handler.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
