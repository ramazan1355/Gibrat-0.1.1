<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Образовательная платформа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #667eea;
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-register {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-register:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateY(-3px);
        }

        .home-link {
            background: rgba(100, 150, 255, 0.2);
            color: #667eea;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            background: rgba(100, 150, 255, 0.3);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 GIBRAT</h1>
        <p>Современная образовательная платформа<br>с AI наставником и интерактивными тестами</p>
        
        <div class="buttons">
            <button class="btn-login" onclick="window.location.href='login.html'">Вход</button>
            <button class="btn-register" onclick="window.location.href='register.html'">Регистрация</button>
        </div>
        
        <p style="margin-top: 30px; font-size: 14px;">или</p>
        <a href="home.html" class="home-link">Посмотреть главную страницу</a>
    </div>
</body>
</html>
