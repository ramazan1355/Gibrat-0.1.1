<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Уроки</title>
    <link rel="stylesheet" href="lessons.css"> 
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT - Уроки</h1>
        </header>

        <main class="content">
            <div class="lessons-list" id="lessons-list">
                <h2>Физика - Мини тесты</h2>
                
                <div class="lesson-card">
                    <h3>Тест 1: Механика</h3>
                    <button class="test-btn" onclick="startTest(1)">Начать тест</button>
                </div>
                
                <div class="lesson-card">
                    <h3>Тест 2: Термодинамика</h3>
                    <button class="test-btn" onclick="startTest(2)">Начать тест</button>
                </div>
                
                <div class="lesson-card">
                    <h3>Тест 3: Электричество</h3>
                    <button class="test-btn" onclick="startTest(3)">Начать тест</button>
                </div>
                
                <div class="lesson-card">
                    <h3>Тест 4: Оптика</h3>
                    <button class="test-btn" onclick="startTest(4)">Начать тест</button>
                </div>
                
                <div id="test-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; padding:20px;">
                    <div style="background:#0B1E32; border-radius:15px; padding:20px; max-width:600px; margin:auto; color:#fff; margin-top:50px;">
                        <h2 id="test-title"></h2>
                        <div id="test-content"></div>
                        <button onclick="closeTest()" style="background:#FF6B6B; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-top:20px;">Закрыть</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <nav class="tab-bar">
        <a href="profile.html" class="tab-item"> 
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="courses.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="2" width="18" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
        </a>
        <a href="index.html" class="tab-item home-button">
            <svg class="tab-icon large-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="lessons.html" class="tab-item active">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="rating.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </a>
    </nav>
    <script>
        // Физика тесты
        const tests = {
            1: {
                title: 'Тест 1: Механика',
                questions: [
                    { q: 'Чему равно ускорение свободного падения?', a: '9.8 м/с²' },
                    { q: 'Что такое инерция?', a: 'Свойство тел сохранять состояние движения' }
                ]
            },
            2: {
                title: 'Тест 2: Термодинамика',
                questions: [
                    { q: 'Какой первый закон термодинамики?', a: 'Закон сохранения энергии' },
                    { q: 'Что такое энтропия?', a: 'Мера беспорядка в системе' }
                ]
            },
            3: {
                title: 'Тест 3: Электричество',
                questions: [
                    { q: 'Какой закон Ома?', a: 'I = U/R' },
                    { q: 'Что такое электрический ток?', a: 'Движение заряженных частиц' }
                ]
            },
            4: {
                title: 'Тест 4: Оптика',
                questions: [
                    { q: 'Что такое преломление света?', a: 'Изменение направления света при переходе в другую среду' },
                    { q: 'Какая скорость света?', a: '3×10⁸ м/с' }
                ]
            }
        };

        function startTest(testNum) {
            const test = tests[testNum];
            const modal = document.getElementById('test-modal');
            const title = document.getElementById('test-title');
            const content = document.getElementById('test-content');
            
            title.textContent = test.title;
            content.innerHTML = test.questions.map((q, i) => `
                <div style="margin:15px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:8px;">
                    <p><strong>${i+1}. ${q.q}</strong></p>
                    <p style="color:#87CEEB;">Ответ: ${q.a}</p>
                </div>
            `).join('');
            
            modal.style.display = 'block';
        }

        function closeTest() {
            document.getElementById('test-modal').style.display = 'none';
        }

        document.querySelectorAll('.tab-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = link.getAttribute('href');
            });
        });
    </script>
</body>
</html>
