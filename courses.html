<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Курсы</title>
    <link rel="stylesheet" href="courses.css"> 

    <style>
        /* --- Аватар --- */
        .ai-box {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            text-align: center;
        }
        #avatar-box {
            width: 260px;
            height: 340px;
            margin: 0 auto 12px auto;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }
        #avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #mouth {
            position: absolute;
            left: 50%;
            top: 71%;
            width: 118px;
            height: 29px;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: 0.08s ease;
            pointer-events: none;
        }
        #ai-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        #ask, #voice-btn {
            margin-top: 10px;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            width: 48%;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT - Курсы</h1>
        </header>

        <!-- 🔥 ИИ-АВАТАР -->
        <div class="ai-box">
            <div id="avatar-box">
                <img id="avatar" src="avatar.png">
                <div id="mouth"></div>
            </div>

            <textarea id="ai-input" placeholder="Спроси меня что угодно..."></textarea>
            <div style="display:flex; justify-content:space-between;">
                <button id="voice-btn">🎤 Говорить</button>
                <button id="ask">Ответить</button>
            </div>
        </div>

        <main class="content">
            <div class="courses-list" id="courses-list">
                <!-- Курсы загружаются здесь -->
            </div>
        </main>
    </div>

    <nav class="tab-bar">
        <a href="profile.html" class="tab-item"> 
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="courses.html" class="tab-item active">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="2" width="18" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
        </a>
        <a href="index.html" class="tab-item home-button">
            <svg class="tab-icon large-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="lessons.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="rating.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </a>
    </nav>

    <script>
        document.querySelectorAll('.tab-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = link.getAttribute('href');
            });
        });

        /* ============================
            МОДУЛЬ ИИ-АВАТАРА
        ============================ */

        const API_KEY = "sk-e0cec48a37bc4588961174b33ce3d385"; 
        const API_URL = "https://api.deepseek.com/chat/completions";

        const mouth = document.getElementById("mouth");

        function mouthMove(level = 1) {
            mouth.style.height = (29 * (1 + level)) + "px";
            mouth.style.transform = `translate(-50%,-50%) scale(1, ${1 + level})`;
        }
        function mouthClose() {
            mouth.style.height = "29px";
            mouth.style.transform = "translate(-50%, -50%) scale(1,1)";
        }

        /* ---------- ГОЛОС ---------- */
        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "ru-RU";

            let male = speechSynthesis.getVoices().find(v =>
                v.lang === "ru-RU" && (v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("yuri"))
            );
            if (male) u.voice = male;

            u.onboundary = () => {
                mouthMove(Math.random() * 0.6 + 0.3);
                setTimeout(() => mouthClose(), 80);
            };

            speechSynthesis.speak(u);
        }

        /* ---------- ИИ РЕСПОНС ---------- */
        async function askAI(q) {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        { role: "system", content: "Ты — умный российский научный ассистент. Отвечай глубоко, умно, структурированно." },
                        { role: "user", content: q }
                    ]
                })
            });

            const data = await res.json();
            return data.choices[0].message.content;
        }

        document.getElementById("ask").onclick = async () => {
            const txt = document.getElementById("ai-input").value;
            if (!txt) return;

            const answer = await askAI(txt);
            speak(answer);
        };

        /* ---------- ГОЛОСОВОЙ ВВОД ---------- */
        const R = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null;

        if (R) {
            rec = new R();
            rec.lang = "ru-RU";

            rec.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById("ai-input").value = text;

                const answer = await askAI(text);
                speak(answer);
            };
        }

        document.getElementById("voice-btn").onclick = () => rec && rec.start();
    </script>
</body>
</html>
