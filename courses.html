<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Курсы с ИИ Аватаром</title>
    <link rel="stylesheet" href="courses.css"> 
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT - Курсы</h1>
        </header>

        <main class="content">
            <div class="courses-list" id="courses-list">
                <!-- Курсы загружаются здесь -->
            </div>

            <!-- ====== Блок ИИ Аватара ====== -->
            <div class="avatar-section" style="margin-top: 40px; text-align:center;">
                <img id="avatar" src="avatar.png" alt="Аватар" style="width: 200px; border-radius: 50%; margin-bottom: 20px;">
                <textarea id="user-text" placeholder="Задайте вопрос..." rows="4" style="width:100%; border-radius:12px; padding:10px;"></textarea>
                <div style="margin-top: 15px; display:flex; gap:10px; justify-content:center;">
                    <button id="ask-btn" class="btn primary">Задать вопрос</button>
                    <button id="listen-btn" class="btn secondary">Слушать</button>
                </div>
                <div id="avatar-response" style="margin-top:20px; font-size:18px; color:#fff;"></div>
            </div>
        </main>
    </div>

    <nav class="tab-bar">
        <a href="profile.html" class="tab-item"> 
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="courses.html" class="tab-item active">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="2" width="18" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
        </a>
        <a href="index.html" class="tab-item home-button">
            <svg class="tab-icon large-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="lessons.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="rating.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </a>
    </nav>

    <script>
        // Навигация вкладок
        document.querySelectorAll('.tab-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = link.getAttribute('href');
            });
        });

        const askBtn = document.getElementById('ask-btn');
        const listenBtn = document.getElementById('listen-btn');
        const userText = document.getElementById('user-text');
        const avatarResponse = document.getElementById('avatar-response');

        // ====== Функция запроса к ИИ и воспроизведения ответа ======
        async function askAI(text){
            avatarResponse.textContent = "Обработка...";

            try {
                // --- 1. Получаем ответ ИИ ---
                const response = await fetch('https://api.deepbrain.io/ask', { // замените на реальный URL API
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'sk-e0cec48a37bc4588961174b33ce3d385'
                    },
                    body: JSON.stringify({
                        text: text
                    })
                });
                const data = await response.json();

                const answer = data.answer || "Извините, я не знаю ответа на этот вопрос.";
                avatarResponse.textContent = answer;

                // --- 2. Синтез речи ---
                const speechResp = await fetch('https://api.deepbrain.io/speak', { // замените на реальный URL
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer YOUR_API_KEY'
                    },
                    body: JSON.stringify({
                        text: answer,
                        voice: 'male',
                        avatar: 'avatar.png'
                    })
                });
                const speechData = await speechResp.json();

                if(speechData.audio_url){
                    const audio = new Audio(speechData.audio_url);
                    audio.play();
                }

            } catch(err){
                console.error(err);
                avatarResponse.textContent = "Ошибка при обработке запроса";
            }
        }

        // ====== Обработчик кнопки "Задать вопрос" ======
        askBtn.addEventListener('click', () => {
            const text = userText.value.trim();
            if(!text) return alert("Введите вопрос");
            askAI(text);
        });

        // ====== Распознавание речи ======
        listenBtn.addEventListener('click', () => {
            if(!('webkitSpeechRecognition' in window)){
                alert('Ваш браузер не поддерживает распознавание речи');
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userText.value = transcript;
                askAI(transcript);
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                alert("Ошибка распознавания речи");
            };
        });
    </script>
</body>
</html>
