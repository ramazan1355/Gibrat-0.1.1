<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Курсы</title>
    <link rel="stylesheet" href="courses.css"> 
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT - Курсы</h1>
        </header>

        <main class="content">
            <div class="courses-container">
                <div class="avatar-section">
                    <div class="avatar-container">
                        <img src="avatar.png" alt="AI Avatar" class="avatar-image">
                    </div>
                    
                    <div class="chat-box">
                        <div class="messages" id="messages">
                            <div class="message bot-message">
                                <p>Привет! Я помогу тебе выбрать курс 📚</p>
                            </div>
                        </div>
                        
                        <div class="input-area">
                            <input type="text" id="userInput" placeholder="Спроси что-нибудь..." class="message-input">
                            <button id="sendBtn" class="send-button">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="courses-list" id="courses-list">
                    <!-- Курсы загружаются здесь -->
                </div>
            </div>
        </main>
    </div>

    <nav class="tab-bar">
        <a href="profile.html" class="tab-item"> 
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="courses.html" class="tab-item active">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="2" width="18" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
        </a>
        <a href="index.html" class="tab-item home-button">
            <svg class="tab-icon large-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="lessons.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="rating.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </a>
    </nav>
    <script>
        // Навигация
        document.querySelectorAll('.tab-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = link.getAttribute('href');
            });
        });

        // Функция отправки сообщения
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messages');
        const coursesList = document.getElementById('courses-list');

        // Примеры курсов
        const courses = [
            { id: 1, title: 'Python Базы', level: 'Начинающий', duration: '4 недели' },
            { id: 2, title: 'JavaScript Мастер', level: 'Средний', duration: '6 недель' },
            { id: 3, title: 'React для профи', level: 'Продвинутый', duration: '8 недель' },
            { id: 4, title: 'AI & Machine Learning', level: 'Продвинутый', duration: '10 недель' }
        ];

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.innerHTML = `<p>${text}</p>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showCourses(filter = null) {
            coursesList.innerHTML = '';
            const filtered = filter ? courses.filter(c => c.title.toLowerCase().includes(filter.toLowerCase())) : courses;
            
            filtered.forEach(course => {
                const courseCard = document.createElement('div');
                courseCard.className = 'course-card';
                courseCard.innerHTML = `
                    <h3>${course.title}</h3>
                    <p class="level">Уровень: ${course.level}</p>
                    <p class="duration">⏱️ ${course.duration}</p>
                    <button class="enroll-btn" onclick="enrollCourse('${course.title}')">Записаться</button>
                `;
                coursesList.appendChild(courseCard);
            });
        }

        window.enrollCourse = function(courseName) {
            addMessage(`Я выбрал(а) ${courseName} 👍`, true);
            setTimeout(() => {
                addMessage(`Отлично! Курс добавлен в твой список. Начинай учиться! 🚀`, false);
            }, 500);
        };

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';

            setTimeout(() => {
                const lowerText = text.toLowerCase();
                let response = 'Интересно! 😊';
                
                if (lowerText.includes('курс') || lowerText.includes('обучение')) {
                    response = 'Вот доступные курсы! Выбери понравившийся 👇';
                    showCourses();
                } else if (lowerText.includes('python') || lowerText.includes('javascript')) {
                    response = 'Отличный выбор! Это популярные языки программирования 💻';
                    showCourses(text);
                } else if (lowerText.includes('какой') || lowerText.includes('рекомендуешь')) {
                    response = 'Рекомендую начать с Python, если ты новичок! Это просто и мощно 🐍';
                    showCourses();
                } else {
                    const responses = [
                        'Интересно! Расскажи подробнее 🤔',
                        'Согласна! Это отличная идея 💡',
                        'Как я могу помочь? 😊'
                    ];
                    response = responses[Math.floor(Math.random() * responses.length)];
                }
                
                addMessage(response, false);
            }, 500);
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Показать курсы при загрузке
        showCourses();
    </script>
</body>
</html>
