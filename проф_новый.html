<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Ментор/Профиль</title>
    <link rel="stylesheet" href="проф .css"> 
    <style>
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .logo {
            flex: 1;
        }

        .logout-btn {
            padding: 8px 15px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #ff5252;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-profile-btn {
            flex: 1;
            padding: 10px;
            background-color: #51cf66;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-profile-btn:hover {
            background-color: #40c057;
        }
    </style>
</head>
<body>
    <div class="container dashboard-container"> 
        <header class="header profile-header">
            <h1 class="logo">GIBRAT</h1>
            <button class="logout-btn" id="logout-btn">Выход</button>
        </header>

        <main class="content profile-content">
            
            <div class="profile-card">
                <img src="Representante de serviço ao cliente avatar digital IA geradora _ imagem Premium gerada com IA.jpeg" alt="Аватар ментора" class="mentor-avatar"> 
                <h2 class="mentor-name">Загрузка...</h2>
                <p class="mentor-email">Загрузка...</p>
                
                <div class="profile-actions">
                    <button class="edit-profile-btn" id="edit-profile-btn">Редактировать профиль</button>
                </div>
            </div>

            <div class="square-actions">
                <button class="square-btn">
                    <svg class="sq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M10 13l2 2 2-2M10 11l2 2 2-2M12 2L6 8l3 10l3 4l3-4l3-10l-6-6z"/>
                    </svg>
                </button>
                <button class="square-btn">
                    <svg class="sq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <div class="progress-card">
                <h3 class="progress-title">прогрес по придметом</h3>
                
                <div class="chart-placeholder">
                    <div class="donut-chart"></div> 
                </div>
            </div>

        </main>
    </div>

    <nav class="tab-bar">
        <a href="проф.html" class="tab-item active"> 
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="кур.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="2" width="18" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
        </a>
        <a href="home.html" class="tab-item home-button">
            <svg class="tab-icon large-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="урок.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="рейтинг.html" class="tab-item">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </a>
    </nav>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="firebase-auth.js"></script>
    <script src="profile-manager.js"></script>
    <script src="navigation.js"></script>

    <script>
        // Обработка выхода
        document.getElementById('logout-btn').addEventListener('click', async () => {
            if (window.firebaseAuthManager) {
                const result = await window.firebaseAuthManager.logout();
                if (result.success) {
                    window.location.href = 'login.html';
                }
            } else {
                localStorage.removeItem('userLoggedIn');
                localStorage.removeItem('userData');
                window.location.href = 'login.html';
            }
        });

        // Обработка редактирования профиля
        document.getElementById('edit-profile-btn').addEventListener('click', () => {
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');
            
            const modal = document.createElement('div');
            modal.className = 'profile-edit-modal';
            modal.innerHTML = `
                <div class="modal-content" style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                    <h2>Редактировать профиль</h2>
                    <form id="profile-edit-form">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Полное имя</label>
                            <input type="text" id="edit-fullname" value="${userData.fullName || ''}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Биография</label>
                            <textarea id="edit-bio" placeholder="Расскажите о себе" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; height: 100px;">${userData.bio || ''}</textarea>
                        </div>
                        <div class="modal-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
                            <button type="submit" class="btn-save" style="flex: 1; padding: 10px; background-color: #51cf66; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Сохранить</button>
                            <button type="button" class="btn-cancel" style="flex: 1; padding: 10px; background-color: #ccc; color: #333; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Отмена</button>
                        </div>
                    </form>
                </div>
            `;
            
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            document.body.appendChild(modal);
            
            const form = modal.querySelector('#profile-edit-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const updates = {
                    fullName: document.getElementById('edit-fullname').value,
                    bio: document.getElementById('edit-bio').value
                };
                
                if (window.firebaseAuthManager) {
                    const userId = window.firebaseAuthManager.getCurrentUserId();
                    if (userId) {
                        const result = await window.firebaseAuthManager.updateProfile(userId, updates);
                        if (result.success) {
                            modal.remove();
                            setTimeout(() => {
                                location.reload();
                            }, 500);
                        }
                    }
                }
            });
            
            const cancelBtn = modal.querySelector('.btn-cancel');
            cancelBtn.addEventListener('click', () => {
                modal.remove();
            });
        });
    </script>
</body>
</html>
